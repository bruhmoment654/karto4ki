name: quizzerg
description: "Quizzerg is a quiz app that allows you to create and share quizzes with your friends."
publish_to: "none"

version: 2.0.1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl:

  # Navigation
  auto_route: 11.1.0

  # Network
  dio: 5.7.0
  connectivity_plus: 6.1.0

  # Storage
  shared_preferences: 2.3.2
  flutter_secure_storage: 9.2.4
  drift: 2.32.1
  drift_flutter: 0.3.1
  sqlite3: 3.1.5

  # Architecture
  nested: 1.0.0
  provider: 6.1.2
  bloc: 8.1.4
  flutter_bloc: 8.1.6
  rxdart: 0.28.0
  async: 2.12.0

  # UI
  flutter_svg: 2.0.17
  octo_image: 2.1.0
  cached_network_image: 3.4.1
  auto_size_text: 3.0.0
  flutter_staggered_animations: 1.1.1
  animations: 2.0.11

  # Auth
  # Реализацию входа через Google пишет владелец проекта — здесь только пакет.
  google_sign_in: 6.2.2

  # Utils
  surf_logger: 2.0.2
  logger: 1.4.0
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  path: 1.9.1
  uuid: 4.5.1
  csv: 6.0.0
  equatable: 2.0.5
  file_picker: 8.1.7
  package_info_plus: ^9.0.0
  material_3_expressive: ^1.1.5
  material_ui: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Кодогенератор связки Dart ↔ натив. В рантайме приложению не нужен.
  pigeon: 27.3.0
  zoloto:
    git:
      url: https://surfstudio.gitlab.yandexcloud.net/internal/flutter/zoloto

  auto_route_generator: 10.5.0
  build_runner: 2.15.1
  flutter_gen: 5.10.0
  drift_dev: 2.32.1
  freezed: 3.2.5
  json_serializable: 6.14.1
  surf_lint_rules: 3.1.0
  theme_tailor: 3.1.3
  spider: 4.2.3
  flutter_launcher_icons: 0.14.4

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Nexa
      fonts:
        - asset: assets/fonts/NexaText-Regular.otf
          weight: 400
        - asset: assets/fonts/Nexa-Bold_0.otf
          weight: 700
        - asset: assets/fonts/Nexa-Black_0.otf
          weight: 900

  assets:
    - assets/icons/

  shaders:
    - assets/shaders/background.frag

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
