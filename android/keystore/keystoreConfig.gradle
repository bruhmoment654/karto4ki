ext {
    def devKeystorePropsFile = rootProject.file("keystore/keystore_dev.properties")
    if (devKeystorePropsFile.exists()) {
        println "Start extract release keystore app_config.dart from keystore_dev.properties"
        def devKeystoreProps = new Properties()
        devKeystoreProps.load(new FileInputStream(devKeystorePropsFile))
        devKeystoreConfig = [
                storePassword: devKeystoreProps['storePassword'],
                keyPassword  : devKeystoreProps['keyPassword'],
                keyAlias     : devKeystoreProps['keyAlias'],
                storeFile    : devKeystoreProps['storeFile']
        ]
    } else {
        println "Start extract release keystore app_config.dart from global vars"
        devKeystoreConfig = [
                storePassword: System.getenv('storePassword'),
                keyPassword  : System.getenv('keyPassword'),
                keyAlias     : System.getenv('keyAlias'),
                storeFile    : System.getenv('storeFile')
        ]
    }
      if(!devKeystoreConfig.storeFile) {
        devKeystoreConfig = null //no keystore available for dev
        println "No keystore file found for dev flavor - will use debug signing"
    } else {
        println "Extracted keystore app_config.dart: $devKeystoreConfig"
    }

    def prodKeystorePropsFile = rootProject.file("keystore/keystore_prod.properties")
    if (prodKeystorePropsFile.exists()) {
        println "Start extract release keystore app_config.dart from keystore_prod.properties"
        def prodKeystoreProps = new Properties()
        prodKeystoreProps.load(new FileInputStream(prodKeystorePropsFile))
        prodKeystoreConfig = [
                storePassword: prodKeystoreProps['storePassword'],
                keyPassword  : prodKeystoreProps['keyPassword'],
                keyAlias     : prodKeystoreProps['keyAlias'],
                storeFile    : prodKeystoreProps['storeFile']
        ]
    } else {
        println "Start extract release keystore app_config.dart from global vars"
        prodKeystoreConfig = [
                storePassword: System.getenv('storePassword'),
                keyPassword  : System.getenv('keyPassword'),
                keyAlias     : System.getenv('keyAlias'),
                storeFile    : System.getenv('storeFile')
        ]
    }
    if(!prodKeystoreConfig.storeFile) {
        prodKeystoreConfig.storeFile = "no_keystore_file" //fix crash file(storeFile)
    }
    println "Extracted keystore app_config.dart: $prodKeystoreConfig"
}
